[package]
name = "sovereign-crypto"
version = "0.1.0"
edition = "2021"
description = "Key hierarchy, AEAD encryption, and Guardian social recovery for Sovereign GE"

[dependencies]
chacha20poly1305 = "0.10"
hkdf = "0.12"
hmac = "0.12.1"
sha2 = { workspace = true }
rand = "0.10"
zeroize = { version = "1.8", features = ["zeroize_derive"] }
base64 = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
chrono = { workspace = true }
# Argon2id for PIN-stretching in the pair_payload flow.
argon2 = "0.5"
# A1 (backup plan): Ed25519 manifest signing, seed-derived from AccountKey.
ed25519-dalek = { version = "2.2", features = ["zeroize"] }

[dependencies.blahaj]
version = "0.6"
optional = true

[dev-dependencies]
tempfile = "3"

[features]
default = ["guardian"]
guardian = ["blahaj"]
