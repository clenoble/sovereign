[package]
name = "sovereign-guardian"
version = "0.1.0"
edition = "2021"
description = "Minimal guardian app: holds friends' recovery key-shards, answers heartbeats, approves recovery requests. No content, no sync, no AI."
publish = false

[[bin]]
name = "sovereign-guardian"
path = "src/main.rs"

[dependencies]
# The plan's dependency rule (G1): p2p + crypto ONLY — no db / ai /
# skills / shell / comms / vault. sovereign-core rides along as the
# lightweight shared base (mailbox wire types, security primitives).
# Known fattening to fix later: sovereign-p2p itself pulls sovereign-db
# for its sync path; a `sync` feature gate on sovereign-p2p would slim
# the guardian build (tracked in the M2 notes, not a G1 blocker).
sovereign-core = { workspace = true }
sovereign-crypto = { workspace = true }
sovereign-p2p = { workspace = true }
# G3 serving mode runs a SovereignNode, whose SyncService needs a GraphDB.
# The guardian never syncs, so it uses an empty in-memory MockGraphDB — this
# is the documented "fattening" (sovereign-p2p already pulls sovereign-db
# transitively); a `sync` feature gate on sovereign-p2p would slim it later.
sovereign-db = { workspace = true, features = ["test-utils"] }

tokio = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
chrono = { workspace = true }
base64 = { workspace = true }
rand = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
zeroize = { version = "1.8", features = ["zeroize_derive"] }

[dev-dependencies]
tempfile = "3"
