[package]
name = "sovereign-skills"
version = "0.1.0"
edition = "2021"
description = "Skill manifest parsing, registry, and CoreSkill trait"

[dependencies]
sovereign-core = { workspace = true }
sovereign-db = { workspace = true }
# The stored document format v2: search, the thread summary and the WASM host
# read document content through it (C-DOC adoption step 1). No I/O.
sovereign-docformat = { path = "../sovereign-docformat" }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true }
chrono = { workspace = true }
genpdf = { workspace = true }
pdf-extract = { workspace = true }
pulldown-cmark = { workspace = true }
regex = { workspace = true }
serde_yml = { workspace = true }
csv = { workspace = true }

# WASM plugin runtime (optional — heavy dependency)
wasmtime = { workspace = true, optional = true }

[features]
default = []
wasm-plugins = ["wasmtime"]

[dev-dependencies]
tempfile = "3"
