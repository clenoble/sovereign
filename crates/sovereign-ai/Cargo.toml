[package]
name = "sovereign-ai"
version = "0.1.0"
edition = "2021"
description = "AI orchestrator with llama.cpp inference (Phase 3)"

[dependencies]
sovereign-core = { workspace = true }
sovereign-db = { workspace = true }
sovereign-skills = { workspace = true }
# The stored document format v2: the assistant's tools, the summarizer, the
# consolidation fingerprint and the peer audit read content through it (C-DOC
# adoption step 1). No I/O, no dependencies.
sovereign-docformat = { path = "../sovereign-docformat" }
# The document service (C-DOC): `docs_host` gives it the personal-data hook
# (the regex ingest of `pii::ingest`), the clock, media hashing and events
# (C-DOC adoption step 2, shared by the shell and the Tauri app).
sovereign-docs = { path = "../sovereign-docs" }
sovereign-crypto = { workspace = true }
tokio = { workspace = true }
async-trait = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
# Local inference. Optional so the Android build links no llama.cpp (K12: no AI
# on mobile, Céline 2026-10-10); without it, loading a model fails cleanly.
llama-cpp-2 = { workspace = true, optional = true }
encoding_rs = { workspace = true }

# Voice pipeline (optional — whisper-rs embeds ggml which conflicts with llama-cpp on Windows)
whisper-rs = { workspace = true, optional = true }
cpal = { workspace = true, optional = true }
ringbuf = { workspace = true, optional = true }

# Wake word (optional due to candle-core version conflicts)
rustpotter = { workspace = true, optional = true }

# Optional P2P deps
sovereign-p2p = { workspace = true, optional = true }

# Jiminy (Reachy Mini) bridge
reqwest = { workspace = true, optional = true }
tokio-tungstenite = { workspace = true, optional = true }
futures-util = { workspace = true, optional = true }

# sha2: model-integrity hashing (always on) + encrypted session log
sha2 = { workspace = true }
base64 = { workspace = true, optional = true }

[dev-dependencies]
sovereign-db = { workspace = true, features = ["test-utils"] }

[features]
default = ["llama", "cuda", "encrypted-log"]
llama = ["dep:llama-cpp-2"]
cuda = ["llama", "llama-cpp-2/cuda"]
voice-stt = ["whisper-rs", "cpal", "ringbuf"]
wake-word = ["voice-stt", "rustpotter"]
p2p = ["sovereign-p2p"]
encrypted-log = ["base64"]
jiminy = ["reqwest", "tokio-tungstenite", "futures-util", "ringbuf"]
vision = ["reqwest"]
