# cargo-audit triage. Each ignore must carry a justification and should be
# re-checked at every release (see .github/workflows/ci.yml rust-audit job).
[advisories]
ignore = [
    # rsa Marvin timing side-channel (no patched release). Pulled in via
    # presage-store-sqlite -> sqlx -> sqlx-mysql; the MySQL driver is never
    # used (Signal store is SQLite-only) and features are additive so it
    # cannot be disabled from this workspace. No RSA decryption oracle is
    # exposed. Re-check when presage/sqlx update.
    "RUSTSEC-2023-0071",
    # hickory-proto DoS issues, pulled in via libp2p-mdns (libp2p 0.56 pins
    # hickory <0.26). mDNS runs only on the local network for peer discovery
    # and sync is gated on device pairing. Bump libp2p when a release using
    # hickory-proto >=0.26.1 lands.
    "RUSTSEC-2026-0118",
    "RUSTSEC-2026-0119",
    # lopdf stack overflow on deeply-nested PDF objects (a PARSING bug). The
    # exploitable path — pdf-extract, which parses untrusted imported PDFs — was
    # upgraded to lopdf 0.42.0 (fixed). The only remaining lopdf 0.26.0 comes via
    # genpdf 0.2.0 (abandoned upstream, pins lopdf 0.26; 0.2.0 is its last
    # release), used solely to GENERATE export PDFs from our own content — it
    # never parses untrusted input, so the overflow is unreachable on that path.
    # Drop this ignore by replacing genpdf in skills/pdf_export.rs.
    "RUSTSEC-2026-0187",

    # ── Accepted 2026-10-10 (Céline), traced with `cargo tree -i` against every
    # shipped artifact (Windows shell, Linux shell, Android APK). An ignore is per
    # advisory ID, not per path: re-trace each one at every release, because a new
    # dependency could bring the same advisory onto a shipped path.

    # wasmtime 44.0.2 — store type-index mix-up, filesystem sandbox escape,
    # hostcall fuel overrun, async-lift stack overflow. Reached only through the
    # `sovereign-skills/wasm-plugins` feature, which no shipped build enables and
    # whose loader has no caller. HARD PRECONDITION: bump to wasmtime >= 48.0.4 /
    # >= 49.0.2 before wasm-plugins is wired into any build; remove these then.
    "RUSTSEC-2026-0222",
    "RUSTSEC-2026-0269",
    "RUSTSEC-2026-0316",
    "RUSTSEC-2026-0327",
    # wasmtime 44.0.2, accepted 2026-10-15 (Céline) on the same grounds — stack
    # overflow dropping recursive types, async-entrypoint not enforced, component
    # handle tables uncapped. Same path, same HARD PRECONDITION, raised: bump to
    # wasmtime >= 48.0.6 / >= 49.0.3 before wasm-plugins is wired in. Traced on
    # PANDA2 and WSL: wasmtime is in neither the shell nor the APK.
    "RUSTSEC-2026-0359",
    "RUSTSEC-2026-0362",
    "RUSTSEC-2026-0363",
    # wasmtime 44.0.2, accepted 2026-10-21 (Céline) on the same grounds — Cranelift
    # on aarch64 can jump to a wrong target on a large Wasm `br_table`. Same path,
    # same HARD PRECONDITION, raised: bump to wasmtime >= 48.0.7 / >= 49.0.4 before
    # wasm-plugins is wired in. Traced at v0.0.11 rc2 (c1b54f6) on the laptop
    # (Windows shell) and on WSL (Linux shell, APK): wasmtime is in none of them.
    "RUSTSEC-2026-0379",
    # quick-xml 0.38.4 / 0.39.4 — quadratic duplicate-attribute check and
    # unbounded namespace allocation (DoS on attacker-controlled XML).
    # 0.38.4: presage -> libsignal-service -> phonenumber, the dormant Signal
    # channel, compiled into no shipped build. 0.39.4: wayland-scanner only, a
    # proc-macro that parses Wayland protocol XML bundled with the crate at
    # compile time — no runtime XML. (plist and zbus_xml, the two runtime paths,
    # were moved to quick-xml >= 0.42 on 2026-10-10.) Drop when presage and
    # wayland-scanner move to quick-xml >= 0.41.
    "RUSTSEC-2026-0194",
    "RUSTSEC-2026-0195",
    # h2 0.3.27 — unbounded empty DATA frames. readability 0.3 -> reqwest 0.11 ->
    # hyper 0.14, only under `sovereign-app/web-browse`, i.e. the frozen Tauri
    # desktop; not in the shell nor the APK. Our fetch path never uses
    # readability's HTTP client. Drop when readability is replaced or used
    # without its client.
    "RUSTSEC-2026-0258",
    # ringbuf 0.4.8 — double free in Consumer::skip/clear when an element's Drop
    # panics. Only under sovereign-ai's voice-stt / jiminy features, in no shipped
    # build; the elements are f32 audio samples, which have no Drop. Bump to
    # ringbuf >= 0.5.2 (API break) before voice ships.
    "RUSTSEC-2026-0293",
    # rkyv 0.7.46 — in the lockfile only as an optional dependency of
    # rust_decimal whose `rkyv` feature is never enabled: never compiled.
    "RUSTSEC-2026-0235",
    # zip 0.6.6 — accepted 2026-10-17 (Céline): SUID/SGID kept on extraction,
    # `extract` following symlinks out of the destination, permissions applied
    # through symlinks. Reached only through rustpotter -> candle-core 0.2.2, i.e.
    # sovereign-ai's wake-word feature, in no shipped build; a transitive pin we
    # cannot bump. Our own zip use (sovereign-import) is on zip 9.0.4 since
    # eef15a2, which is not affected. HARD PRECONDITION: bump or replace
    # rustpotter before voice ships; remove these then. An ignore is per ID: if
    # another path ever brings an affected zip, these lines would hide it —
    # re-trace with `cargo tree -i zip` at every release.
    "RUSTSEC-2026-0367",
    "RUSTSEC-2026-0368",
    "RUSTSEC-2026-0369",
    # zstd 0.13.3 (stream data leaking into the next stream on a reused context) and
    # zstd-safe 7.2.4 (uninitialised memory on a failed legacy-frame decompression;
    # Seekable::decompress setting a Vec length past its capacity) — accepted
    # 2026-10-28 (Céline). In the lockfile only, through wasmtime-internal-cache 44,
    # whose cache feature no build enables: `cargo tree -i zstd` and
    # `cargo tree -i zstd-safe` (--target all -e all) match no package on PANDA2,
    # 2026-10-28. The fixes (zstd >= 0.14.3, zstd-safe >= 8.2.0) are major versions
    # wasmtime 44 does not accept. zstd-sys, which rocksdb does link, is on 2.1.2
    # (RUSTSEC-2026-0410 fixed). Re-trace both at every release; drop these with the
    # wasmtime bump the HARD PRECONDITION above already requires.
    "RUSTSEC-2026-0391",
    "RUSTSEC-2026-0398",
    "RUSTSEC-2026-0403",

    # ── Accepted 2026-11-04 (Céline), found by the rc2 Linux gate (WSL 0034).
    # wasmtime 44.0.2 — unchecked memory in a borrowed-resource transfer. Same path,
    # same HARD PRECONDITION, raised: bump to wasmtime >= 48.0.8 / >= 49.0.5 / >= 50.0.1
    # before wasm-plugins is wired in. `cargo tree -i wasmtime -e all --target all`
    # matches no package (WSL and PANDA2, 2026-11-04).
    "RUSTSEC-2026-0424",
    # zip 0.6.6 — `extract` aborts on a symlink entry. Same path as the zip ignores
    # above (rustpotter -> candle-core 0.2.2), same HARD PRECONDITION. `cargo tree -i
    # zip@0.6.6 -e all --target all` matches no package (WSL and PANDA2, 2026-11-04).
    "RUSTSEC-2026-0429",
    # RUSTSEC-2026-0418 (libz-sys) and RUSTSEC-2026-0433 (pulldown-cmark) are fixed by
    # the lock bump of 2026-11-13 (libz-sys 1.1.31, pulldown-cmark 0.13.6), past the
    # two-week rule; their ignores are gone.

    # ── Accepted 2026-11-13 (Céline), the triage of the 19 advisories found by
    # `cargo audit` on 2026-11-13 (traced on the laptop at main ba1dc18; texts read in
    # the local advisory-db). Two are NOT here: RUSTSEC-2026-0525 (libp2p-quic) and
    # -0538 (quinn-udp) are fixed in their own lot before rc1 (« Lot avant rc1 »), so
    # the gate stays red on them until it lands.

    # SurrealDB 2.6.5 / surrealkv 0.9.3 — « Accepter + lot 4.x après licence ». The
    # cure for all three is SurrealDB 4.x (0454: « removed in 4.0.0 »; 0452: « surrealdb
    # 4.0.0 ships surrealkv 1.2.0 »), planned as its own lot once its licence is read.
    # 0453, use-after-free in the KV backends: reached only if a future is leaked
    # (mem::forget, Box::leak, ManuallyDrop, a reference cycle, a leaked enclosing
    # future); dropping one is safe. `git grep -E "mem::forget|Box::leak|ManuallyDrop"`
    # in crates/*/src outside tests matches nothing; the other two ways are not
    # greppable. CONDITION: re-run that grep at every release; any match near the store
    # is a blocker.
    "RUSTSEC-2026-0453",
    # 0454, unsound Send/Sync in `reblessive`: only through surrealdb-core's own
    # executor; nothing of ours touches `reblessive` (`git grep`: no match). A latent
    # unsoundness, not a demonstrated race in that executor.
    "RUSTSEC-2026-0454",
    # 0452, out-of-bounds read on a crafted or corrupted SSTable (CVSS AV:L): the
    # phone's store. Exploiting it needs write access to the app's private files,
    # which ch. 07's at-rest model already leaves out of scope. CONDITION (binding): no
    # state that arrives from outside the device is ever written as a store file; it is
    # applied through the store's calls (sync and backup restore do so today; the
    # export, backups between contacts and a node replica must too).
    "RUSTSEC-2026-0452",

    # hickory-proto / hickory-resolver 0.25.2 — libp2p 0.56 pins hickory < 0.26; the
    # fixes are 0.26.2. Accepted on the grounds of RUSTSEC-2026-0118/-0119 above.
    # 0491: memory amplification decoding a DNS message (a packet claiming 65,535
    # records reserves ~18 MB before failing). Live: libp2p-mdns decodes multicast DNS
    # from every network the device joins (mDNS is on by default, P2P-006 can switch it
    # off). A LAN-side DoS, the class already accepted.
    "RUSTSEC-2026-0491",
    # 0487, 0489, 0490: panics parsing SVCB/HTTPS records and zone files from TEXT.
    # mDNS and DNS decode wire format; nothing of ours parses zone files.
    "RUSTSEC-2026-0487",
    "RUSTSEC-2026-0489",
    "RUSTSEC-2026-0490",
    # DNSSEC validation flaws (proto 0504, 0505, 0511, 0512, 0530, 0531, 0532; resolver
    # 0514): no `dnssec-*` feature is compiled (`cargo tree -e features -i hickory-proto`
    # and `-i hickory-resolver`, --target all: mdns, std, tokio, socket2, futures-io;
    # system-config, tokio). CONDITION: re-trace the features at every release.
    "RUSTSEC-2026-0504",
    "RUSTSEC-2026-0505",
    "RUSTSEC-2026-0511",
    "RUSTSEC-2026-0512",
    "RUSTSEC-2026-0530",
    "RUSTSEC-2026-0531",
    "RUSTSEC-2026-0532",
    "RUSTSEC-2026-0514",

    # ammonia 4.2.4 — mutation XSS through embedded SVG/MathML. Only through
    # surrealdb-core's HTML string functions, which none of our queries call
    # (`git grep string::html`: no match). The fix 4.2.5 is of 2026-11-13: bump it, and
    # drop this line, from 2026-11-27 (two-week rule).
    "RUSTSEC-2026-0533",

    # libsqlite3-sys 0.30.1 — SQLite CVE. Lockfile only: `cargo tree -i libsqlite3-sys`
    # matches no package (under presage-store-sqlite / sqlx, the dormant Signal store),
    # as rkyv's RUSTSEC-2026-0235.
    "RUSTSEC-2026-0459",

    # ── Accepted 2026-11-20 (Céline, on the Fable maille's page of the rc1 gates:
    # « II - à signaler dans les notes de release / à mettre au backlog »), found by
    # both rc1 gates (Linux on 4688fdd9, Windows on 55ab7bf8).

    # wasmtime 44.0.2 — unbounded host memory on empty AsyncWriteStream writes; an
    # abort in builds without `threads`; a panic in Caller::get_module_export; unbounded
    # heap on empty HTTP/2 body writes. Same path as the wasmtime ignores above, same
    # HARD PRECONDITION, raised: bump to wasmtime >= 48.0.9 / >= 49.0.6 / >= 50.0.2
    # before wasm-plugins is wired in. `cargo tree --locked -i wasmtime -e all --target
    # all` matches no package (PANDA2, 2026-11-20).
    "RUSTSEC-2026-0566",
    "RUSTSEC-2026-0567",
    "RUSTSEC-2026-0569",
    "RUSTSEC-2026-0571",
    # zip 0.6.6 — AES entries returned unauthenticated when the data ends early, and
    # ZipStreamReader's local-header names. Same path as the zip 0.6.6 ignores above
    # (rustpotter -> candle-core 0.2.2), same HARD PRECONDITION. `cargo tree --locked
    # -i zip@0.6.6 -e all --target all` matches no package (PANDA2, 2026-11-20).
    # -0548 also names zip 9 < 9.0.5: our zip 9 is bumped to 9.4.1 in the same commit,
    # so this ID hides nothing that is compiled. Re-trace `cargo tree -i zip` at every
    # release, as above.
    "RUSTSEC-2026-0545",
    "RUSTSEC-2026-0548",
    # hickory-proto 0.25.2 — three more DNSSEC validation flaws (an NSEC3 NODATA at a
    # zone apex; an unsigned NSEC/NSEC3 record in a proof; records of another class
    # marked secure). Fixed only in hickory-net 0.26.2, which libp2p 0.56 does not take.
    # The `dnssec` module is compiled only with `dnssec-ring` or `dnssec-aws-lc-rs`
    # (hickory-proto 0.25.2 src/lib.rs l. 55-56), and neither the shell nor the APK
    # enables one (`cargo tree --locked -e features -i hickory-proto`: futures-io, mdns,
    # socket2, std, tokio; PANDA2 claude-coord 0509, the laptop 0441). The same grounds
    # as the DNSSEC group above, the same CONDITION.
    "RUSTSEC-2026-0549",
    "RUSTSEC-2026-0550",
    "RUSTSEC-2026-0551",
    # lettre 0.11.22 — STARTTLS reply injection, SMTP command injection by a bare CR/LF, two
    # panics, a quoted local part sent elsewhere, an unbounded reply buffer. Accepted 2026-11-20
    # (Céline: « lettre : on peut annoncer qu'il sera monté avec l'email pour la prochaine
    # version et dire qu'il est désactivé pour le moment ? »; the Fable maille's yes). Email is
    # off in v0.0.13: `sovereign-shell/src/comms.rs` l. 35, `EMAIL_ENABLED: bool = false`, a
    # constant. lettre is called only through `comms::sync_email` and `comms::send_email`, whose
    # only callers, `comms_form_sync` and `compose_send` (app.rs), return at their first line
    # when it is false (PANDA2, 2026-11-20). Not in the APK (`cargo tree --locked -p
    # sovereign-app --no-default-features --features mobile --target aarch64-linux-android -i
    # lettre`). HARD PRECONDITION: bump lettre (>= 0.11.24) with email, in v0.0.14, before
    # EMAIL_ENABLED turns true; remove these then.
    "RUSTSEC-2026-0560",
    "RUSTSEC-2026-0561",
    "RUSTSEC-2026-0562",
    "RUSTSEC-2026-0563",
    "RUSTSEC-2026-0564",
    "RUSTSEC-2026-0565",
]
